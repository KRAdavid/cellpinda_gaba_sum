name: Monitor GABA Shorts candidates
run-name: GABA Shorts monitor (${{ github.event_name }})

on:
  schedule:
    # 09:17 KST; keep the local operating time explicit.
    - cron: '17 9 * * *'
      timezone: "Asia/Seoul"
  workflow_dispatch:

concurrency:
  group: gaba-shorts-daily-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect new GABA Shorts candidates
        run: npm run monitor:gaba-shorts:write
      - name: Check for inbox changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- docs/GABA_VIDEO_INBOX.md docs/GABA_VIDEO_DAILY_REPORT.md docs/GABA_VIDEO_REVIEW_LOG.md docs/GABA_VIDEO_TRIAGE.md docs/gaba-video-daily src/gabaMonitorSnapshot.ts)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit review inbox
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GABA_VIDEO_INBOX.md docs/GABA_VIDEO_DAILY_REPORT.md docs/GABA_VIDEO_REVIEW_LOG.md docs/GABA_VIDEO_TRIAGE.md docs/gaba-video-daily src/gabaMonitorSnapshot.ts
          git commit -m "chore: update GABA Shorts review inbox"
          git push
